name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Advisories appear without anyone pushing, so scan on a schedule too.
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.25"
  NODE_VERSION: "20"

jobs:
  go:
    name: Go build, vet, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # A dirty go.mod/go.sum means the committed dependency set does not match
      # what the code imports, which makes every other result unreliable.
      - name: go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code --stat go.mod go.sum || {
            echo "::error::go.mod/go.sum are not tidy. Run 'go mod tidy' and commit."
            exit 1
          }

      - name: gofmt
        run: |
          unformatted=$(gofmt -l ./cmd ./internal)
          if [ -n "$unformatted" ]; then
            echo "::error::Not gofmt-clean:"; echo "$unformatted"
            exit 1
          fi

      - run: go build ./...
      - run: go vet ./...
      - name: Unit tests
        run: go test ./... -race -count=1

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: health_checker
          POSTGRES_PASSWORD: test
          POSTGRES_DB: health_checker
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U health_checker"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://health_checker:test@localhost:5432/health_checker?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Apply migrations
        run: |
          go install github.com/pressly/goose/v3/cmd/goose@latest
          goose -dir db/migrations postgres "$TEST_DATABASE_URL" up

      # These cover the parts a mock cannot: the SQL itself, partition routing
      # on probe_results, and Postgres advisory-lock semantics under real
      # concurrency, which is what leader election is built on.
      - name: Store and leader election
        run: go test -tags=integration -race -count=1 ./internal/store/ ./internal/leader/

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # Reachability-based, unlike Dependabot: it reports only advisories whose
      # vulnerable symbols this code actually calls.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: npm audit
        working-directory: web
        run: npm audit --audit-level=moderate

  web:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: Typecheck
        working-directory: web
        run: npx tsc --noEmit
      - name: Build
        working-directory: web
        run: npm run build

  chart:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4

      # Helm cannot read outside the chart directory, so the chart carries a
      # synced copy of db/migrations. Drift means the migration Job would run
      # against a stale or empty schema.
      - name: Chart migrations match db/migrations
        run: |
          diff -r db/migrations deploy/helm/migrations || {
            echo "::error::deploy/helm/migrations has drifted. Run 'make helm-sync-migrations'."
            exit 1
          }

      - name: Lint
        run: helm lint deploy/helm --values deploy/helm/values-local.yaml

      - name: Render local values
        run: helm template health-checker deploy/helm --values deploy/helm/values-local.yaml >/dev/null

      # The production path must render too, with LDAP configured rather than
      # auth disabled.
      - name: Render production values
        run: |
          helm template health-checker deploy/helm \
            --set config.ldapURL=ldaps://ldap.example.com:636 \
            --set config.ldapBaseDN='dc=example,dc=com' >/dev/null

      # The chart refuses configurations the API would reject at startup.
      # Verify the guards still fire, so a future edit cannot silently remove
      # them and reintroduce a CrashLoopBackOff-on-install.
      - name: Render guards reject invalid config
        run: |
          if helm template health-checker deploy/helm >/dev/null 2>&1; then
            echo "::error::Chart rendered with neither LDAP nor authDisabled; the guard is gone."
            exit 1
          fi
          if helm template health-checker deploy/helm \
               --values deploy/helm/values-local.yaml \
               --set config.ldapURL=ldaps://x:636 >/dev/null 2>&1; then
            echo "::error::Chart rendered with both authDisabled and ldapURL; the guard is gone."
            exit 1
          fi
          echo "both guards fired as expected"

  docker:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Build only, no push: this proves the multi-stage Dockerfile still works
      # with the pinned toolchain images, which is where a Go or Node version
      # bump breaks first.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: health-checker-router:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
