apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hcr.fullname" . }}
  labels:
    {{- include "hcr.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "hcr.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "hcr.selectorLabels" . | nindent 8 }}
      annotations:
        # Restarts pods when non-secret config changes, which would otherwise
        # require a manual rollout to take effect.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "hcr.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      # Spread replicas across nodes so a single node loss does not take the
      # whole prober fleet with it.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "hcr.selectorLabels" . | nindent 14 }}
      containers:
        - name: api
          image: {{ include "hcr.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
          envFrom:
            - configMapRef:
                name: {{ include "hcr.fullname" . }}-config
            {{- with .Values.secrets.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            - name: HTTP_ADDR
              value: ":{{ .Values.service.targetPort }}"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.databaseSecretName }}
                  key: {{ .Values.secrets.databaseSecretKey }}
            {{- if .Values.config.ldapURL }}
            - name: LDAP_BIND_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.ldapSecretName }}
                  key: {{ .Values.secrets.ldapSecretKey }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            # /readyz checks the database. A pod that cannot reach Postgres
            # leaves the Service rather than serving errors.
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            # readOnlyRootFilesystem is on, so anything needing scratch space
            # gets an explicit emptyDir.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      # Long enough for in-flight SSE connections to drain on a rolling deploy.
      terminationGracePeriodSeconds: 45
